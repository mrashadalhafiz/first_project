<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>

    <main class="dashboard">
        <!-- Greeting -->
        <section class="card greeting-card">
            <div id="currentTime" class="current-time">00:00:00</div>
            <div id="currentDate" class="current-date">Loading date...</div>
            <h1 id="greeting">Good Morning</h1>

            <!-- Challenge 2: Custom name -->
            <div class="name-settings">
                <input id="nameInput" type="text" maxlength="30" placeholder="Your name">
                <button id="saveNameBtn" type="button">Save Name</button>
            </div>
        </section>

        <section class="main-grid">
            <!-- Focus Timer -->
            <section class="card timer-card">
                <h2>Focus Timer</h2>
                <div id="timerDisplay" class="timer-display">25:00</div>

                <!-- Challenge 3: Change Pomodoro time -->
                <div class="timer-settings">
                    <label for="durationSelect">Duration</label>
                    <select id="durationSelect">
                        <option value="15">15 minutes</option>
                        <option value="25" selected>25 minutes</option>
                        <option value="30">30 minutes</option>
                        <option value="45">45 minutes</option>
                        <option value="60">60 minutes</option>
                    </select>
                </div>

                <div class="button-row">
                    <button id="startBtn" class="primary-btn" type="button">Start</button>
                    <button id="stopBtn" type="button">Stop</button>
                    <button id="resetBtn" type="button">Reset</button>
                </div>
            </section>

            <!-- Tasks -->
            <section class="card tasks-card">
                <h2>Tasks</h2>

                <form id="taskForm" class="input-row">
                    <input
                        id="taskInput"
                        type="text"
                        maxlength="100"
                        placeholder="Add a new task..."
                        autocomplete="off"
                        required
                    >
                    <button class="primary-btn" type="submit">Add</button>
                </form>

                <p id="taskMessage" class="message" aria-live="polite"></p>
                <ul id="taskList" class="task-list"></ul>
            </section>
        </section>

        <!-- Quick Links -->
        <section class="card links-card">
            <h2>Quick Links</h2>

            <form id="linkForm" class="link-form">
                <input
                    id="linkNameInput"
                    type="text"
                    maxlength="40"
                    placeholder="Link name"
                    required
                >
                <input
                    id="linkUrlInput"
                    type="url"
                    placeholder="https://example.com"
                    required
                >
                <button class="primary-btn" type="submit">Add Link</button>
            </form>

            <p id="linkMessage" class="message" aria-live="polite"></p>
            <div id="linkList" class="link-list"></div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
